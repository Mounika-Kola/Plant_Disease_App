<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plant Disease Detector</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🌱 Plant Disease Identification and Pesticide Recommendation using CNN</a>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container mt-4">
    <div class="row">

      <!-- Upload Panel -->
      <div class="col-md-6 mb-4">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">Upload Image</div>
          <div class="card-body text-center">
            <input type="file" id="fileInput" accept="image/*" class="form-control mb-3">
            <button class="btn btn-primary" onclick="uploadImage()">Predict from Upload</button>
          </div>
        </div>
      </div>

      <!-- Camera Panel -->
      <div class="col-md-6 mb-4">
        <div class="card shadow">
          <div class="card-header bg-warning text-dark">Capture Image</div>
          <div class="card-body text-center">
            <video id="camera" autoplay class="border mb-3" style="width:100%;"></video>
            <button class="btn btn-warning" onclick="capture()">Capture & Predict</button>
            <canvas id="snapshot" class="d-none"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Result Panel -->
    <div class="row">                
      <div class="col-12">           
        <div class="card shadow">    
          <div class="card-header bg-success text-white">
            Prediction Result
          </div>
          <div class="card-body">
            <div id="result">
              <p class="text-muted">No prediction yet. Upload or capture an image.</p>
            </div>
            <img id="preview" src="" alt="Preview"
                 style="max-width:300px; margin-top:10px; display:none; border:1px solid #ccc;">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    const video = document.getElementById('camera');
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => video.srcObject = stream);

    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");
    const resultPanel = document.getElementById("result");

    // Show preview immediately after file upload
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          preview.src = e.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    });

    function uploadImage() {
      const file = fileInput.files[0];
      if (!file) { alert("Select an image first!"); return; }
      const formData = new FormData();
      formData.append("file", file);

      fetch("/predict", { method: "POST", body: formData })
        .then(res => {
          if (!res.ok) throw new Error("Server error " + res.status);
          return res.json();
        })
        .then(data => {
          console.log("Prediction response:", data);
          showResult(data);
        })
        .catch(err => {
          console.error("Prediction error:", err);
          alert("Prediction failed. Check backend logs.");
        });
    }

    function capture() {
      const canvas = document.getElementById('snapshot');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      // Convert captured image to preview immediately
      const dataURL = canvas.toDataURL("image/png");
      preview.src = dataURL;
      preview.style.display = "block";

      canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append("file", blob, "plant.jpg");

        fetch("/predict", { method: "POST", body: formData })
          .then(res => {
            if (!res.ok) throw new Error("Server error " + res.status);
            return res.json();
          })
          .then(data => {
            console.log("Prediction response:", data);
            showResult(data);
          })
          .catch(err => {
            console.error("Prediction error:", err);
            alert("Prediction failed. Check backend logs.");
          });
      });
    }

    function showResult(data) {
  resultPanel.innerHTML = ""; // clear old content

  if (data.error) {
    // Show error in red
    resultPanel.innerHTML = `<p style="color:red; font-weight:bold;">${data.error}</p>`;
  } else {
    // Show normal prediction
    resultPanel.innerHTML = `
        <p><b>Disease:</b> ${data.disease}</p>
        <p><b>Pesticides Recommended:</b> ${data.pesticide}</p>
        <p><b>Confidence:</b> ${data.confidence}</p>`;
  }
}
    
  </script>
</body>
</html>
